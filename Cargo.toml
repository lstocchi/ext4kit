[package]
name = "ext4kit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bollard = "0.19"
clap = { version = "4.5", features = ["derive"] }
dua-core = "5.0.0"
getrandom = "0.3"
flate2 = "1"
futures-util = "0.3"
memmap2 = "0.9"
oci-distribution = "0.11"
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "io-util"] }
tokio-util = { version = "0.7", features = ["io-util"] }
zerocopy = { version = "0.8.59", features = ["derive"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
